[package]
name = "komo-tools"
version = "0.1.0"
edition = "2024"

[features]
# Shared tool-test fixtures, for a dependent crate's tests. Off in real builds.
test-support = []

[dependencies]
komo-core = { path = "../komo-core" }
komo-infra = { path = "../komo-infra" }
komo-mcp = { path = "../komo-mcp" }
komo-pyhost = { path = "../komo-pyhost" }
komo-services = { path = "../komo-services" }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { workspace = true, features = ["stream"] }
# Header constants for `web_fetch`'s content-type gate.
http = "1.5.0"
# `shell` puts each command in its own process group so a timeout kills the
# whole tree, which needs the raw setpgid/killpg calls.
libc = "0.2.189"
