[package]
name = "komo-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
komo-core = { path = "../komo-core" }
komo-config = { path = "../komo-config" }
komo-provider = { path = "../komo-provider" }
komo-infra = { path = "../komo-infra" }
komo-services = { path = "../komo-services" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
tokio = { version = "1.53.1", features = ["full"] }
# Cron-expression parsing for the maintenance supervisor's schedules.
croner = "3"
# `mach_task_basic_info` for the memory-monitor sweep's RSS reading.
libc = "0.2.189"
# Resolves `~/.agents` for the machine-wide instruction file.
dirs = { workspace = true }

[dev-dependencies]
# `TimeTool` as a real tool in the runtime's loop tests.
komo-tools = { path = "../komo-tools" }
tokio = { version = "1.53.1", features = ["full", "test-util"] }
