[package]
name = "komo-services"
version = "0.1.0"
edition = "2024"

[features]
# Lets a dependent crate's tests build a static `SkillRegistry`; off in every
# real build.
test-support = []

[dependencies]
komo-core = { path = "../komo-core" }
komo-config = { path = "../komo-config" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
time = { workspace = true }
# Local-time rendering for a session chunk's date, matching every other
# operator-facing timestamp in komo.
chrono = { workspace = true }
# Content digests for checkpointed files — "changed since the run left it?"
sha2 = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1.53.1", features = ["full"] }
# `join_all` — a round's independent tool calls run concurrently.
futures-util = { workspace = true }
# `grep`/`glob` are ripgrep's own component libraries, in-process (see AGENTS.md).
ignore = "0.4.31"
globset = "0.4.19"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
# Unified diffs + line-level add/remove counts for `edit` / `apply_patch`.
similar = "3.1.1"

[dev-dependencies]
# Builds throwaway vaults for the indexing tests.
tempfile = "3"
# Ages a manifest to test the retention sweep.
filetime = "0.2"
