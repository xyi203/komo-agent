[package]
name = "komo-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
# Cron-expression parsing for `domain::cron`'s next-occurrence math.
croner = "3"

[dev-dependencies]
# Test-only: the approval gate is async, so its tests need a runtime. A
# dev-dependency does not reach consumers, so the crate stays runtime-free.
tokio = { version = "1.53.1", features = ["macros", "rt"] }
